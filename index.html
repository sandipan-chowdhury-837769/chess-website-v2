<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Website of Sandipan</title>
    <!-- Local CSS files -->
    <link rel="stylesheet" href="chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Chessboard & Probabilities -->
        <div class="board-container">
            <div id="eval-container">
                <div id="eval-bar">
                    <div id="eval-fill" style="width: 50.0%;"></div>
                </div>
                <div class="eval-labels">
                    <span id="win-prob-white">White: 50.0%</span>
                    <span id="win-prob-black">Black: 50.0%</span>
                </div>
            </div>

            <div class="board-panel">
                <div id="board"></div>
                <svg id="arrow-svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
        </div>

        <!-- Right Panel: Controls -->
        <div class="control-panel">
            <div id="game-setup-page">
                <h1>Chess Website of Sandipan</h1>
                
                <a href="about.html" class="dev-link-btn" target="_blank">About the Developer</a>
                
                <div class="settings" style="margin-top: 15px;">
                    <label>Play as:</label>
                    <select id="player-color">
                        <option value="w" selected>White</option>
                        <option value="b">Black</option>
                    </select>

                    <label>Opponent Level:</label>
                    <select id="elo">
                        <option value="400">Noob Opponent (400 ELO)</option>
                        <option value="800">Rookie Opponent (800 ELO)</option>
                        <option value="1200" selected>Novice Opponent (1200 ELO)</option>
                        <option value="1600">Average Opponent (1600 ELO)</option>
                        <option value="2000">Skilled Opponent (2000 ELO)</option>
                        <option value="2400">Talented Opponent (2400 ELO)</option>
                        <option value="2800">Grandmaster Opponent (2800 ELO)</option>
                    </select>
                    
                    <label>Assistance Mode:</label>
                    <select id="assistance">
                        <option value="on">Play with assistance</option>
                        <option value="off" selected>Play without assistance</option>
                    </select>

                    <button id="start-btn">Start Game</button>
                    
                    <div class="action-buttons">
                        <button id="resign-btn" class="btn-resign" disabled>Resign</button>
                        <button id="draw-btn" class="btn-draw" disabled>Offer Draw</button>
                    </div>

                    <button id="review-btn" disabled>Match Review</button>
                </div>

                <div id="status" style="margin-top: 15px;">Status: Waiting to start...</div>
            </div>
        </div>
    </div>

    <!-- Local JS files matching your zip directory -->
    <script src="jquery.min.js"></script>
    <script src="chessboard-1.0.0.min.js"></script>
    <script src="chess.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
